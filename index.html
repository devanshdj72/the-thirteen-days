<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Thirteen Days</title>
<meta name="description" content="a love letter, spoken aloud, in twelve parts and a thirteenth that changes them all">
<meta name="theme-color" content="#171a29">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thirteen Days">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ece3d0;
    --paper-2: #e4d9c2;
    --ink: #2c2620;
    --ink-soft: #55483a;
    --gold: #b9873a;
    --gold-deep: #8f6224;
    --rose: #a25454;
    --spine: #1c1712;
    --shadow: rgba(28, 20, 12, 0.35);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% 18%, #2c3348 0%, #171a29 55%, #0a0b12 100%);
    font-family:'Crimson Pro', serif;
    overflow:hidden;
    color:var(--ink);
  }
  #app{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- COVER / LANDING ---------- */
  #landing{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    transition: opacity 0.9s ease, visibility 0.9s;
  }
  #landing.hidden{ opacity:0; visibility:hidden; pointer-events:none; }

  .cover-wrap{
    perspective: 2400px;
  }
  .cover{
    width: min(340px, 78vw);
    height: min(510px, 78vh);
    border-radius: 3px 8px 8px 3px;
    box-shadow:
      0 40px 90px rgba(0,0,0,0.65),
      inset -3px 0 0 rgba(255,255,255,0.05),
      inset 6px 0 14px rgba(0,0,0,0.55);
    position:relative;
    transform-style: preserve-3d;
    cursor:pointer;
    transition: transform 1.1s cubic-bezier(.61,.02,.13,1.005);
    transform-origin: left center;
    overflow:hidden;
    border: 1px solid rgba(122,138,199,0.35);
  }
  .cover-art{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    display:block;
  }
  .cover-vignette{
    position:absolute; inset:0;
    background: linear-gradient(0deg, rgba(8,8,14,0.35) 0%, rgba(8,8,14,0) 30%);
    pointer-events:none;
  }
  .cover-tap{
    position:absolute; bottom:20px; left:0; right:0;
    text-align:center;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:lowercase;
    color:#e7e2f2;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

  .cover.opening{
    transform: rotateY(-155deg);
  }

  /* ---------- READER ---------- */
  #reader{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transition: opacity 0.7s ease;
  }
  #reader.visible{ opacity:1; }

  .book-stage{
    perspective: 2600px;
    width: min(720px, 94vw);
    height: min(560px, 84vh);
    position:relative;
  }

  .book{
    position:relative;
    width:100%; height:100%;
    display:flex;
  }

  .spine-shadow{
    position:absolute; top:2%; bottom:2%; left:50%;
    width:26px; margin-left:-13px;
    background: linear-gradient(90deg, rgba(0,0,0,0.28), rgba(0,0,0,0.05) 45%, rgba(0,0,0,0.05) 55%, rgba(0,0,0,0.28));
    z-index:5; pointer-events:none;
    filter: blur(2px);
  }

  .page-face{
    position:absolute; top:0; bottom:0;
    width:50%;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at 15% 8%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(ellipse at 85% 95%, rgba(0,0,0,0.05), transparent 40%);
    padding: clamp(24px,4vw,46px) clamp(20px,3.6vw,40px);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .page-face.left{ left:0; border-radius: 6px 0 0 6px; box-shadow: inset -14px 0 24px -18px rgba(0,0,0,0.45), -6px 6px 24px rgba(0,0,0,0.35); }
  .page-face.right{ right:0; border-radius: 0 6px 6px 0; box-shadow: inset 14px 0 24px -18px rgba(0,0,0,0.45), 6px 6px 24px rgba(0,0,0,0.35); }

  .page-chapter-label{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:12px;
    color: var(--gold-deep);
    letter-spacing:0.02em;
    margin-bottom:14px;
    opacity:0.85;
    flex-shrink:0;
  }
  .page-text{
    font-size: clamp(14px, 1.55vw, 16.5px);
    line-height:1.72;
    color: var(--ink);
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color: rgba(140,110,60,0.35) transparent;
    padding-right:4px;
  }
  .page-text::-webkit-scrollbar{ width:5px; }
  .page-text::-webkit-scrollbar-thumb{ background: rgba(140,110,60,0.35); border-radius:4px; }
  .page-text::-webkit-scrollbar-track{ background:transparent; }
  .page-text p{ margin:0 0 1em 0; }
  .page-text p:last-child{ margin-bottom:0; }
  .page-num{
    font-family:'Fraunces', serif;
    font-size:11px;
    color: var(--ink-soft);
    opacity:0.55;
    text-align:center;
    margin-top:10px;
    flex-shrink:0;
  }

  /* chapter divider page styling */
  .page-face.divider{
    align-items:center; justify-content:center; text-align:center;
  }
  .divider-ornament{ font-size:20px; color:var(--gold); margin-bottom:18px; }
  .divider-title{
    font-family:'Fraunces', serif;
    font-size: clamp(20px,2.6vw,26px);
    color:var(--ink);
    line-height:1.3;
  }
  .divider-index{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:13px;
    color:var(--gold-deep);
    margin-top:10px;
  }

  /* flipping page (the animated one) */
  .flipper{
    position:absolute; top:0; bottom:0; right:0; width:50%;
    transform-style: preserve-3d;
    transform-origin: left center;
    z-index:20;
    pointer-events:none;
    visibility:hidden;
    transition: transform 0.95s cubic-bezier(.61,.06,.19,1.0);
  }
  .flipper.active{ visibility:visible; }
  .flipper .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    background: var(--paper);
    border-radius: 0 6px 6px 0;
    padding: clamp(24px,4vw,46px) clamp(20px,3.6vw,40px);
    display:flex; flex-direction:column;
    overflow:hidden;
    box-shadow: 6px 6px 24px rgba(0,0,0,0.35);
  }
  .flipper .face.back{
    transform: rotateY(180deg);
    border-radius: 6px 0 0 6px;
  }
  .flipper.flip-next{ transform: rotateY(-179.9deg); }
  .flipper.flip-prev-init{ transform: rotateY(-179.9deg); transition:none; }
  .flipper .shade{
    position:absolute; inset:0;
    background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.18) 100%);
    opacity:0;
    transition: opacity 0.95s ease;
    pointer-events:none;
  }
  .flipper.flip-next .shade{ opacity:1; }

  /* controls */
  .nav-zone{
    position:absolute; top:0; bottom:0; width:14%;
    z-index:30; cursor:pointer;
  }
  .nav-zone.left{ left:0; }
  .nav-zone.right{ right:0; }

  .ui-bar{
    position:absolute; left:0; right:0; bottom:18px;
    display:flex; align-items:center; justify-content:center; gap:18px;
    z-index:40;
    font-family:'Crimson Pro', serif;
  }
  .ui-btn{
    background:none; border:none; color:#c9bfa9;
    font-size:22px; cursor:pointer; opacity:0.75;
    transition: opacity 0.2s, transform 0.2s;
    padding:6px 10px;
  }
  .ui-btn:hover{ opacity:1; transform: scale(1.12); }
  .ui-btn:disabled{ opacity:0.25; cursor:default; transform:none; }
  .progress-text{
    color:#a89a7d; font-size:13px; letter-spacing:0.03em; min-width:120px; text-align:center;
    font-style:italic;
  }

  .top-bar{
    position:absolute; top:16px; left:22px; right:22px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:40; color:#a89a7d; font-size:12px; letter-spacing:0.05em;
    gap:14px;
  }
  .top-bar .title-mini{ font-family:'Fraunces', serif; font-style:italic; opacity:0.75; flex-shrink:0; }
  .top-bar-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .top-bar button{
    background:none;border:none;color:#a89a7d;font-size:12px;cursor:pointer;
    opacity:0.7; font-family:'Crimson Pro',serif;
    white-space:nowrap;
  }
  .top-bar button:hover{ opacity:1; }
  .top-bar button#editBtn.active{ color:#c99742; opacity:1; }
  .top-bar button#saveBtn{ color:#8fbf7a; }

  .save-toast{
    position:absolute; top:50px; right:22px; z-index:45;
    background: rgba(20,18,14,0.92);
    color:#e7dfc9; font-size:12px; letter-spacing:0.03em;
    padding:8px 14px; border-radius:4px;
    border: 1px solid rgba(201,151,66,0.35);
    opacity:0; transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events:none;
    font-family:'Crimson Pro', serif;
  }
  .save-toast.show{ opacity:1; transform: translateY(0); }

  .page-text[contenteditable="true"]{
    outline: none;
    cursor: text;
    background: linear-gradient(rgba(185,135,58,0.05), rgba(185,135,58,0.05));
    box-shadow: inset 0 0 0 1px rgba(185,135,58,0.28);
    border-radius: 3px;
  }
  .page-text[contenteditable="true"]:focus{
    box-shadow: inset 0 0 0 1px rgba(185,135,58,0.55);
  }

  /* mobile: single page */
  @media (max-width: 720px){
    .top-bar{ flex-direction:column; align-items:flex-start; gap:6px; }
    .top-bar-actions{ width:100%; justify-content:flex-start; gap:12px; }
    .book-stage{ width: 100vw; height: 100vh; }
    .page-face{ width:100%; }
    .page-face.left{ display:none; }
    .page-face.right{ border-radius:0; }
    .flipper{ width:100%; }
    .spine-shadow{ display:none; }
    .flipper .face{ border-radius:0; }
    .flipper .face.back{ border-radius:0; }
  }

  ::selection{ background: rgba(185,135,58,0.25); }
</style>
</head>

<script>
const CHAPTERS = [{"title": "The Way I Found You", "paras": ["You're sitting in the good chair again. The one by the window, the one you always take before I can, like you've got some invisible claim filed on it that predates both of us.", "I want to tell you something and I don't know how to start it right, so let me start with your hands instead, because I've been looking at them for the last five minutes and you haven't noticed, the way you never notice when I'm doing this.", "Your hands are not soft the way people write about hands being soft. There's a small callus on your right index finger from years of holding a pen too hard, pressing down like the paper owed you something. Your nails are always a little uneven on the left hand because you bite them when you're thinking, and never on the right, because you say a person needs one hand that still looks presentable in an argument. I've watched those hands do a hundred small, specific things --- steal food off my plate without asking, click a pen like a gavel to end a conversation, hold a cup of tea with both palms wrapped around it even after the tea's gone cold, because you once told me cold hands make you feel like a ghost.", "I think about that sentence more than you'd probably like me to. Cold hands make you feel like a ghost. I've never told you this, but sometimes I reach over just to check that yours are warm. Not because I think anything's wrong. Just because I like the proof.", "You'd call this dramatic if I said it to your face, so I'm saying it now, to the room, while you're looking out the window at nothing in particular the way you do when you think I'm not paying attention.", "You are, if I'm honest, built more like weather than like a person. Not gentle weather. The kind that arrives fast and changes a whole afternoon before anyone's ready for it --- a sky that was blue an hour ago suddenly deciding to do something enormous. I have watched you go from laughing so hard you can't finish a sentence to a silence I could set a clock by, all inside of ten minutes, over something as small as a comment you didn't like the shape of. I used to find that frightening. I don't anymore. I've learned to read you the way farmers read a sky --- not to avoid the storm, just to know when to bring things in off the line before it hits.", "You hate that comparison. You've told me so, more than once, usually right after I've made it. \"I'm not weather,\" you said the first time, \"I'm a person, I have reasons.\" And you do. You always do. But even your reasons arrive like weather arrives --- fast, total, impossible to argue with once they're already over you.", "I love you the way people love things they can't fully explain. Not the way people love a nice view, where you can point at the specific hill or the specific light and say, there, that's the good part. More the way you love a place you grew up in, where the good part isn't any one thing --- it's the whole arrangement of it, the smell of a particular hallway, the sound a particular door makes, and you couldn't take any single piece out and hand it to a stranger and expect them to understand why it matters.", "You're not listening to any of this. You're watching a bird outside the window --- a mynah, loud and self-important, strutting along the ledge like it owns the building --- and some part of me wants to stop talking and just watch you watch it, because your face does something specific when you're paying attention to something small: your whole jaw softens, like whatever you were bracing for a second ago has been called off.", "I used to think I'd get tired of noticing things like that. Two years in, I thought, surely by now the noticing wears off, surely a person's face becomes just a face after enough time. It hasn't. If anything I notice more now than I did at the start, the way you notice a house better after you've lived in it a while and finally know which floorboards give.", "The mynah flies off. You turn back to me like nothing happened, like you weren't just gone somewhere for thirty seconds, and you ask what I was saying, and I say, \"Nothing important,\" because some things I'd rather keep saying to a room that's only half listening than say directly to a face that might ask me to explain myself.", "I think, sometimes, that loving you is like learning a second language no one else teaches — one with no textbook, no grammar rules, only context, only repetition, only the slow accumulation of a thousand small exposures until one day you realize you've become fluent in someone without ever formally studying them. I did not choose to learn you. You simply became the language my whole chest started speaking in, sometime between the umbrella and now, and I didn't notice the exact day it happened, the way you never notice the exact day you stop translating a language in your head and simply start thinking in it instead."]}, {"title": "Things That Became Ours", "paras": ["You steal my food every single day and I have never once seen you finish your own.", "I brought this up again today --- not seriously, we've had this conversation probably forty times and it always ends the same way --- and you said, without even looking up, \"Yours tastes like someone made it with love. Mine tastes like my mother is annoyed at my father.\" You said it so plainly, chewing, like you were reading a weather report, and I laughed so hard I nearly choked, and you didn't even smile, because you never think your funniest things are funny. That's the part that gets me. The genuinely funny people never seem to know it.", "I've decided, watching you eat off my plate for what must be the four hundredth time, that you're a bit like a magpie. Not in the insulting way --- I mean the specific, particular way magpies are supposed to be drawn to things that already belong to someone else, not out of need, just because taking it seems to satisfy something in them that having their own version doesn't. You have six of my pens in your bag right now. I know because I counted. You didn't need a single one of them. You have your own, a whole case of them, color-coded in a system you've explained to me at length and that I still don't fully understand. But mine are more interesting to you purely because they're mine, and I've stopped minding, because I think somewhere in that small, thoughtless theft is the closest thing you have to a love language. You don't say things. You take my pens.", "I want to tell you about the drains behind the gym. There's a wall back there that smells faintly terrible and has bad shade and nobody in their right mind would choose to eat lunch there, and it is, somehow, without either of us ever formally deciding it, the only place either of us actually wants to sit. You once told me it's because nobody else wants it, which means it's actually ours in a way the nicer spots never could be, since nobody's fighting us for it. I think about that sentence a lot. You've never wanted the nice, obvious things. You want the things that are unclaimed enough to be entirely yours.", "You have a chip in your front tooth from a bicycle accident when you were nine, and you hide it with your hand whenever you laugh too widely, and you don't know that the hiding is the thing I notice first, before the laugh even lands, because your hand starts moving toward your mouth a half-second before the sound comes out --- some old, practiced defense your body still runs automatically, years after anyone stopped caring about the tooth at all.", "You asked me once what I actually love about you, expecting, I think, some list of the obvious things --- the way you look, the way you laugh --- and I told you the truth instead, which disappointed you slightly, I could tell: I said I love the specific, un-photogenic mechanics of you. The way you argue with a teacher's grading logic like it's a court case. The way you go completely silent when you're actually upset instead of loud, which took me a full year to learn. The way you called our chemistry teacher \"structurally incapable of joy\" and meant it as a serious diagnosis.", "\"That's not romantic,\" you said.", "\"It's the most romantic thing I've got,\" I said, and you rolled your eyes, but you didn't argue, which from you is basically a love letter of its own.", "I have decided, since, that love is not the grand thing people write songs about — not the fireworks, not the single perfect sentence spoken at the right dramatic moment. I think it is closer to weather-proofing a house. Small, unglamorous, unglorified work, done over and over, in places no one else will ever see: memorizing which of your moods needs silence and which needs a joke, learning exactly how long to let an argument breathe before it turns to rot, noticing a callus on a finger that nobody else has ever thought to look at closely enough to notice. Nobody applauds you for it. Nobody's supposed to. You just wake up one day and realize the house has survived a hundred storms it had no business surviving, and understand, quietly, that the unglamorous work is the only reason it's still standing at all."]}, {"title": "Where You Let Me In", "paras": ["There was a fight. I want to tell you about it honestly, because I think you'd want me to, and because some nights I still turn it over looking for the exact place I went wrong.", "It was over a photograph --- you laughing at a wedding, mouth wide open, caught mid-joke by someone else's phone, and I made a comment about it, something stupid and offhand, meant to be funny, and you went quiet in that specific way that isn't sulking, it's a total withdrawal, like you'd physically left the room while your body stayed behind out of politeness.", "I didn't understand at first. I pushed, the way I always push when I don't understand something, which you've told me is one of my worst habits and you are, as with most things, correct. It took hours --- actual hours, not the tidy five minutes these things take in stories --- before I understood that the photograph had caught you exactly the way you're most afraid of being caught: unguarded, unflattering by your own private, unreasonably harsh standard, and that my joke had confirmed the one thing you'd been hoping nobody else had noticed.", "I said something worse before I said something better. I told you that you were overreacting, which is possibly the single most useless sentence available to say to someone who is not, in fact, overreacting, just reacting to something you hadn't bothered to understand yet.", "You didn't speak to me for a day and a half. I want to be honest that it was the longest thirty-one hours of my life up to that point, worse than any exam, worse than any wait for any result --- not because I was afraid of losing you, exactly, though I was that too, but because I hated, specifically, being someone who had made you feel exposed rather than safe, when safety was the entire thing I thought I was supposed to be providing.", "You finally came to the gate, arms crossed, and made me say the actual thing I was sorry for instead of the generic thing, because you've never once let me get away with an apology that doesn't name its own crime. I said it. You uncrossed your arms --- not right away, you made me wait, which I understood, even in the moment, was fair.", "I never made a joke about a photo of you again. Not because I was scared to. Because I finally understood that some things that look small from outside a person are enormous from inside them, and loving someone properly means learning the difference before they have to stand at a gate and explain it to you with their arms crossed.", "I think forgiveness, when it's real, doesn't arrive the way people describe it — a door swinging suddenly open, relief flooding in all at once. It arrives more like tide does, slow, reluctant, taking back only as much ground as it's ready to give up, and if you'd tried to rush it, tried to force the water in before it was ready to come, you'd have drowned something that needed to be waded into carefully instead. You gave me back the coastline an inch at a time, that day at the gate, and I have never once resented how long it took, because I understood, even at seventeen, that anything given back too easily was never really worth having kept.", "You're across from me now, folding something, not looking at me, and I want to say all of this out loud, and instead I just watch your hands work --- steady, precise, the same hands that once held an entire silent thirty-one hours against me without flinching."]}, {"title": "Even Your Storms", "paras": ["You have a temper that arrives like something small and fast --- not a storm this time, more like a hare breaking cover, gone before you've even registered the motion. One second you're calm, mid-sentence, and the next you've said something sharp enough to leave a mark, and by the time I've caught up to what happened, you're already back to calm again, as if the anger were a visitor who let itself out through a door I never saw open.", "I used to take it personally. I don't anymore. I've watched it happen at teachers, at your sister, at a rude auto driver, at the actual weather once, memorably, when it rained through your only good pair of shoes on a day that mattered to you --- and I've come to understand that your anger isn't really about the target. It's a pressure valve, quick and total, built into you the way a kettle's whistle is built into a kettle, and once it's gone off, the water underneath is just water again.", "You do carry things longer when you think you deserve to be angry and aren't allowing yourself to be. Those are the dangerous ones --- not the hare breaking cover, but the thing you decide not to let out at all, that sits and sits until it turns into something else entirely, quiet and cold, days later, over something unrelated.", "I told you once you were easier to read than you think you are. You said, \"That sounds like something someone says right before they get something about me completely wrong.\" Which, I'll admit, is fair. I don't think I've ever fully read you. I've just gotten good at guessing, and you've been generous enough not to correct me every single time I guess wrong.", "I think, if I'm honest, that this is closer to what loving a person actually is than anything the songs promised me. Not perfect comprehension. Not two minds fused into one, reading each other effortlessly the way the films like to suggest. Just two people making educated, generous guesses about each other, forever, and choosing, every single time, to stay in the guessing rather than walk away simply because certainty was never actually on offer. I would rather spend a lifetime guessing at you and being occasionally wrong than have anyone else in the world handed to me fully understood on the first day.", "A few days ago you asked what I was doing on my birthday.", "I told you I hadn't decided.", "\"Good,\" you said.", "\"Why good?\"", "\"No reason.\"", "You said it too quickly.", "I should have noticed."]}, {"title": "Waiting for Rain", "paras": ["I want to tell you about the umbrella again, because I don't think I've ever told it to you the way it actually happened in my head, only the version that makes me sound less obvious than I was.", "I checked the weather for eleven days. I want that number exact, because I remember counting, obsessively, in a way that embarrassed me even at the time. Eleven days of hoping for rain, which is an insane thing to hope for, and on the eleventh day it finally rained, and I brought the umbrella like I hadn't been waiting for exactly this, and you looked at me standing there with it, dry, prepared, entirely too prepared for someone who claimed not to have planned anything, and you said, \"You've been checking the weather,\" and I denied it, badly, and you let me keep denying it because some part of you found the badness of the lie more charming than the truth would have been.", "You are, in this specific and narrow sense, like a plant that only blooms under conditions nobody else would bother arranging for it. Most things want sun, want easy, want obvious. You wanted rain, and inconvenience, and an umbrella held slightly wrong so your left shoulder kept getting wet anyway, and you complained about all of it the entire walk home, and I have never in my life enjoyed being complained at as much as I enjoyed it that day, because I understood, even then, that the complaining was you deciding to stay under the umbrella anyway.", "Some people are drawn to ease the way water finds the lowest point in a room. You have never once, in two years, been that kind of person. You seek out the exact conditions most people spend their whole lives avoiding — the discomfort, the inconvenience, the version of a thing that costs something — and I think that's because you've never fully trusted anything that arrived without a price attached to it. I used to find that exhausting. I've come to find it something closer to beautiful: you have never once loved anything the easy way, including me, and I would rather be loved by someone who chose the harder path toward me on purpose than be loved by someone who simply drifted into it because it was the nearest, most convenient shape available.", "This week, you asked me what time I'd be home on my birthday.", "I laughed.", "\"Why are you collecting information?\"", "\"I'm not.\"", "\"You literally just asked what time I'd be home.\"", "\"You could have plans.\"", "\"On my own birthday?\"", "\"Exactly.\"", "Then you changed the subject.", "I didn't think much of it.", "I think about it now."]}, {"title": "A Life We Kept Saying Later", "paras": ["Today I watched you fall asleep in the middle of a sentence --- an actual sentence, mid-word, your voice just trailing into breath --- and I sat there for twenty minutes without moving because I didn't want to be the reason you woke up.", "You looked, in that specific unguarded stillness sleep gives a person, like something I don't fully have a comparison for. Not fragile --- you'd hate that word. Something closer to a held breath. A note sustained a beat past where a song would normally let it go.", "I thought, watching you, about all the ordinary Sundays we haven't had yet. The one where you make something with too much garlic in it on purpose, because you think garlic is the only spice worth the argument it causes with everyone around you afterward. The one where we watch that terrible film you love and I love now too, by some kind of contagion I didn't consent to and don't regret. The one where we just walk somewhere with no destination, because you've told me the best conversations only happen when nobody's trying to get anywhere.", "We keep saying later. I keep saying later. I don't know why I trust that word as much as I do --- later has never once, in the whole history of anyone using it, been a guarantee of anything.", "I think about time the way people who've never been near a coastline think about the sea — as something enormous, patient, essentially endless, always there tomorrow exactly as it was there today. I have never once, in seventeen years, been made to understand that time is closer to a candle than an ocean: a fixed, finite, quietly diminishing thing, burning at a rate you cannot see and are not permitted to check, giving no warning at all before the very last of it simply runs out. I did not know, watching you sleep mid-sentence on an ordinary evening, that I was spending candlelight I would have hoarded like a miser if anyone had told me the true size of what was left.", "You woke up on your own, a few minutes after I started watching, and blinked at me.", "\"How long was I asleep?\"", "\"Not long.\"", "\"You're lying.\"", "\"Maybe.\"", "You smiled.", "Then you said, \"Don't make plans for your birthday.\"", "\"Why?\"", "\"Because I said so.\"", "I laughed.", "You didn't."]}, {"title": "The Shape of Us", "paras": ["I keep the mug on my desk now. The chipped blue one. You use it every single time you're here, both hands around it even after it's gone cold, because --- you told me this once, completely seriously, in a tone that dared me to laugh --- cold hands make you feel like a ghost, and a warm mug makes you feel like a person.", "I noticed something strange today, and I want to say it out loud even though I don't fully understand it: the room felt very still while you were drinking from it. Not peaceful-still. A different kind of still --- the kind a room gets when a window's been left open somewhere and you can't find which one.", "I made two cups today, the way I always do, yours and mine, and I don't know why I keep noticing, lately, how long yours sits there before you pick it up. You always do pick it up.", "I have started thinking of you the way you'd think of a lighthouse — not the light itself, but the specific, steady rhythm of it, on, off, on, off, something you don't consciously watch for anymore because you've long since trusted it to simply keep happening on schedule, night after night, without your supervision. I have built my entire sense of safety around the rhythm of you being here. I did not know, until recently, how much of my own steadiness was actually borrowed from yours, the way a small boat doesn't think about the lighthouse at all until the one night the light doesn't come on.", "You looked at the calendar over my shoulder.", "\"How many days?\"", "\"Until what?\"", "\"My birthday.\"", "\"Why do you care?\"", "\"I don't.\"", "You counted anyway.", "\"Six.\"", "Then you looked at me and smiled in that way that always makes me suspicious.", "\"What?\"", "\"Nothing.\"", "I let it go, the way I let most of your \"nothing\"s go, because I had learned, across two years, that pushing on one of your nothings only ever bought me a longer silence and no actual answer, and I had never once thought to ask myself why I was so willing to accept a locked door simply because you were the one holding the key. I think, now, that trust and laziness can look identical from the inside — both of them feel like peace, both of them feel like choosing not to worry — and I am still trying to work out, months later, which one I was actually practicing on the six days I had left to ask you properly.", "There are so many things I should have asked you.", "I keep a list of them now, though I've never written it down anywhere, because writing it down would mean admitting how long it's gotten. What was in the bag. What the wrapping paper was for. Why you kept asking what time I'd be home, on a day that was supposed to be entirely about me and required, by any reasonable accounting, nothing at all from you. I had every opportunity in the world to simply ask, directly, the way you'd always taught me to ask the actual thing rather than the generic thing. I chose curiosity's quieter cousin instead — mild, comfortable, untroubled not-knowing — because some part of me, I think, actually liked the idea of being surprised, and never once considered that the surprise might cost more than either of us had budgeted for."]}, {"title": "Somewhere We Were Going", "paras": ["You told me once that you wanted a dog, and then changed your mind about the breed roughly every three weeks depending on whatever video you'd most recently watched, and I stopped trying to keep track of the current answer because I understood, eventually, that the dog itself mattered less to you than the argument about which dog.", "We'd live somewhere with a balcony. That part was never negotiable, not once, not even as a joke --- you wanted somewhere to dry your hair in the sun the way your grandmother used to, an image you've described to me so many times, in such consistent detail, that I can see it now without ever having met the woman it belongs to.", "I wanted somewhere near water. You asked why, once, and I didn't have a real answer, just a vague sense that water makes a place feel less permanent, and you pointed out, correctly, that this was a strange thing to want from somewhere you were planning to live in permanently.", "You never let an inconsistency like that pass without comment, and I loved you for it even when it was inconvenient, even when I would have preferred to keep a small, comfortable contradiction quietly to myself. You had a way of holding a sentence up to the light, turning it over once, and handing it back to me slightly dented, and somehow that process never once felt like an attack. It felt like maintenance. Like someone caring enough about the structure of your thoughts to make sure they'd actually hold weight before you built anything real on top of them.", "I think about the balcony and the water and the dog with no fixed breed more than is probably healthy for a boy my age to think about a future this specific and this unearned.", "We haven't done anything yet to deserve a balcony.", "We're seventeen.", "We have a wall behind a gym that smells like drains and a chipped mug and forty unfinished arguments and that, somehow, some days, feels like more than enough to build an imagined life out of.", "I think a future, when you're young enough, is a little like a constellation — a handful of scattered, disconnected points, a balcony here, a dog there, a Sunday with too much garlic in it somewhere further off, and no actual lines drawn between any of them yet, nothing to prove the shape will ever really form. You don't need the lines drawn to love the shape anyway. You just need to know the stars are there, fixed, patient, willing to wait however long it takes for two people to finally get around to connecting them.", "I did not know, mapping out that constellation with you on lazy afternoons that felt like they had no ceiling on them at all, that a constellation is only ever a trick of perspective — that the stars in it are not actually neighbors, are not actually close to one another at all, are scattered across distances too enormous to properly picture, and only look connected because of exactly where you happen to be standing when you look up. I wonder now whether our future looked whole only because of where the two of us happened to be standing on the particular Tuesday we were imagining it, and whether, from any other point in time, the same scattered stars might have simply stayed scattered, refusing every line I tried to draw between them.", "Three days before my birthday, you asked me whether I liked blue wrapping paper.", "I said, \"That's an incredibly specific question.\"", "You said, \"It's an incredibly specific opinion.\"", "I told you I didn't care.", "You said, \"Good.\"", "I should have known then."]}, {"title": "The Things We Couldn’t Say", "paras": ["I want to tell you about the confession, because I don't think I've ever told it to you honestly, only the smoothed-over version I give when other people ask how we started.", "I typed *I think I like you* and deleted it. Typed it again. Deleted it again. What I actually sent, after eleven humiliating minutes, was *so. are we a thing.*", "You didn't answer for four minutes.", "Then:", "*what thing.*", "My stomach actually dropped. And then, right as I started typing some long, over-engineered explanation:", "*i'm kidding. yes. obviously. you've been checking the weather for a month, i'm not going to make you also spell out the rest of it.*", "I've read that message so many times I can recite it without checking.", "No eye contact. No rehearsed speech. Just two exhausted teenagers typing badly at each other close to midnight.", "I think about the four minutes of silence more than I think about the message itself, some days. Four minutes is nothing, measured against a whole life — shorter than a bus ride, shorter than a class period, shorter than almost anything you'd bother timing on purpose. And yet I have never since experienced time behave the way it behaved in those four minutes, thick and slow and entirely unwilling to move at its usual speed, as if the universe itself understood that something large was about to be decided and wanted to make me sit properly with the weight of it before letting me know how it would land.", "We were never going to be the couple with the cinematic beginning.", "We were always going to be the couple who fell into something enormous through a typo and a missing period after the word \"so.\"", "I think the truest things two people ever say to each other rarely arrive dressed the way declarations are supposed to be dressed. Love, in my experience, is a poor performer and a devoted stagehand — it almost never shows up on the lit part of the stage, saying the line everyone's been waiting for. It shows up backstage, in a message with no punctuation, in eleven deleted drafts, in a girl asking what time you'll be home without telling you why she's asking. I have stopped waiting for the grand version of anything. The backstage version, it turns out, is where you actually lived.", "Two years later, I was still bad at saying things directly.", "So were you.", "Which is probably why you thought a surprise was a better idea than simply telling me what you were planning.", "I think, in hindsight, that this was the one true inheritance our relationship left neither of us any room to escape: two people who had built an entire beginning out of unspoken things, sending each other messages that meant more than their words technically said, were always going to keep speaking to each other that way, right up until the very end, one of us asking about wrapping paper instead of simply announcing a gift, the other one accepting the mystery instead of simply demanding an answer, because that, in the end, was the only language we had ever really agreed to speak fluently together.", "I didn't know that then."]}, {"title": "Before I Forget", "paras": ["Something happened today that I don't fully know how to write down, so I'm going to write it down anyway and let it sit here unexplained.", "I made your tea, same as always, and set it across from mine, and started telling you about my day --- nothing important, a class I didn't absorb a single word of, a friend who asked if I was doing better and got a flat, automatic *yeah, getting there* in return --- and I looked up partway through and for just a second, less than a second, I couldn't remember what your voice actually sounds like when it isn't answering something I've just said.", "I had to wait for you to say something back before the sound of it came back to me properly.", "That frightened me more than I want to admit.", "I think fear, the real kind, rarely arrives the way it does in stories — loud, obvious, announced. It arrives the way a single missing note arrives in a song you know by heart: everything around it sounds exactly right, and yet something in your chest knows, instantly, before your mind can even name what's wrong, that the shape of the whole thing has changed. I didn't know, in that half-second, what I was actually afraid of. I only knew that some small, essential note had gone missing from a song I thought I had memorized completely.", "You laughed at something I said a moment later --- the specific cracked-at-the-end kind --- and the sound of it filled the gap back in immediately.", "I didn't tell you about the strange half-second.", "I don't know why.", "I think there are certain fears you don't say out loud not because you're brave, but because naming them feels like handing them a kind of permission they haven't earned yet — as if silence were a cage you could still keep something small and dangerous locked inside of, and speech were the door you'd be opening on purpose. I kept that half-second locked up in exactly that kind of silence, told myself it was nothing, told myself the same lie people have been telling themselves since the first time a person loved someone enough to be frightened of losing them: that not saying a thing out loud is the same as it not being true.", "There was another thing I didn't understand.", "Your phone was on the table.", "I reached for it when it lit up.", "The screen went dark before I could see the message.", "\"Who was that?\"", "You looked at me.", "\"No one.\"", "\"You've been saying that a lot.\"", "\"So have you.\"", "Then you smiled.", "\"One more day.\"", "\"One more day until what?\"", "You only shook your head.", "I think, now, about how much of love is built on exactly this kind of patient not-knowing — two people constantly withholding some small, harmless-seeming thing from each other, trusting that the other person will forgive the gap once the reason finally surfaces. I trusted you completely, that evening, the way you trust a bridge you've crossed a thousand times without once checking the structural report underneath it. I did not know that the bridge itself had already been standing on borrowed time, that \"one more day\" was not a tease at all but the truest sentence you'd said to me all week, and that I would spend the rest of my life understanding it only in reverse."]}, {"title": "Where You Should Have Been", "paras": ["My mother asked me today who the second cup was for.", "I didn't have an answer that wouldn't sound strange out loud, so I said nothing, and she looked at me the way she's started looking at me lately --- not scared, exactly, but careful.", "She looked at the second cup for a long time.", "Then she took the sugar bowl away.", "She didn't touch the cup.", "You didn't hear any of that conversation.", "You were somewhere else in the room, or maybe you'd already left by then. I honestly can't remember the order things happened in today, which is its own small, quiet worry I'm choosing not to look at too closely.", "I keep thinking about something you said once, ages ago, about how the mind plays tricks on people who miss things too hard.", "I think about it constantly now.", "There is a particular kind of quiet that settles over a house once someone has decided not to ask the next question — not the quiet of peace, but the quiet of a held silence, deliberate, careful, the kind you'd use to carry something breakable across a room without daring to look down at it. My mother's silence, taking the sugar bowl but leaving the cup, was that second kind. I understand now that she was carrying something across the room too. I just didn't know, at the time, that it was me.", "Today I went through my phone.", "I found our messages.", "The confession.", "The photograph fight.", "The umbrella.", "The stupid arguments.", "Your messages about my birthday.", "There was one from three days before.", "*don't make plans.*", "Another from two days before.", "*what time will you be home?*", "And the last one.", "*don't open the door before i tell you.*", "I stared at that message for a long time.", "I don't remember ever receiving it.", "I don't remember what happened after it.", "I only remember that I never answered.", "I think, sometimes, about all the small, ordinary messages that pass between two people in the course of an ordinary week — the *on my way*, the *five minutes*, the *did you eat* — and how none of us ever reads them as anything other than logistics, small administrative proof that a life is continuing exactly as expected. I read that entire thread today the way you'd read the transcript of a trial after already knowing the verdict, watching every ordinary sentence suddenly reveal a second meaning it never had permission to carry at the time. *Don't make plans.* *What time will you be home.* *Don't open the door before i tell you.* Not logistics at all. A countdown, spoken in the most ordinary language available to either of us, and I had read every single line of it as nothing more than a girl planning a surprise for a boy who loved her, because that was the only story I had any reason, that week, to believe I was living inside of."]}, {"title": "One More Tomorrow", "paras": ["I sat on the wall behind the gym today, the one that smells faintly of the drains, the one that's ours because nobody else wants it, and I told you everything --- the confession, the fight about the photograph, the umbrella, the eleven days of checking the weather, all of it, start to finish, the way you'd tell a story to someone who already knows the ending but wants to hear you tell it anyway.", "I don't know why I needed to tell it all again, in one sitting, instead of scattered the way it usually comes out of me. Something in the day felt like it was asking for a full accounting, the way you clean an entire house before guests arrive even though no single room was actually dirty enough to justify it on its own. I told it slowly. I let myself linger on the parts I usually rush past — the exact four minutes of silence after the confession, the exact angle my arm had gotten stuck at during the first hug, the exact shade of orange the marigolds were the one time you wore them in your hair for a festival and complained the whole day that they made your scalp itch.", "You listened the way you always listen when I do this — patient, slightly amused, occasionally correcting a detail I'd gotten wrong, though today I noticed you corrected fewer of them than usual, as if the details had stopped mattering to you the way they used to, or as if you already knew, somewhere I couldn't follow, that the exact shade of the marigolds was about to matter far more to me than to you.", "You said, near the end, \"You tell it better every time.\"", "And I said I'd been practicing.", "You said, \"Practicing for who?\"", "I didn't have an answer.", "You let the silence sit there instead of pushing, which isn't like you.", "I noticed.", "I didn't examine it.", "Then I asked you the question I've been carrying for thirteen days.", "\"Why didn't you tell me?\"", "You looked confused.", "\"Tell you what?\"", "\"About my birthday.\"", "You smiled.", "\"It was supposed to be a surprise const STORAGE_KEY = 'thirteen-days-edits-v1';

function loadSavedChapters(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    if(Array.isArray(saved) && saved.length === CHAPTERS.length) return saved;
  }catch(e){ /* ignore corrupt storage */ }
  return null;
}

// If the person has saved edits before on this device/browser, those
// take over from the originally-published text.
const saved = loadSavedChapters();
if(saved){ saved.forEach((c,i)=>{ CHAPTERS[i].paras = c.paras; }); }

let hasUnsavedChanges = false;

const isMobile = () => window.innerWidth <= 720;

// ---- Simple, deterministic pages: one page per chapter, in full.
// No measurement, no guessing, no chunking, no window-size dependent
// logic that can silently go wrong. Every word of every chapter is
// always present exactly as written. If a chapter runs long for the
// current screen, that page scrolls internally (see .page-text) —
// nothing is ever cut, shortened, or unevenly split. ----
function buildPages(){
  const out = [];
  out.push({type:'title'});
  CHAPTERS.forEach((ch) => {
    out.push({type:'content', title: ch.title, paras: ch.paras});
  });
  out.push({type:'end'});
  return out;
}

let pages = buildPages();
let current = 0;

function renderPageInner(pIdx){
  if(pIdx < 0 || pIdx >= pages.length) return '';
  const pg = pages[pIdx];
  if(pg.type === 'title'){
    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;">
      <div class="divider-ornament">&#10022;</div>
      <div class="divider-title" style="font-size:clamp(22px,3vw,30px);">The Thirteen Days</div>
      <div class="divider-index">a love letter, spoken aloud, in twelve parts<br>and a thirteenth that changes them all</div>
    </div>`;
  }
  if(pg.type === 'end'){
    return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;">
      <div class="divider-ornament">&#10022;</div>
      <div class="divider-title">The Thirteen Days</div>
      <div class="divider-index">— end —</div>
    </div>`;
  }
  // content — the ENTIRE chapter, every paragraph, always
  const paraHtml = pg.paras.map(t => `<p>${escapeHtml(t)}</p>`).join('');
  return `<div class="page-chapter-label">${pg.title}</div>
          <div class="page-text">${paraHtml}</div>`;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

const pageLeft = document.getElementById('pageLeft');
const pageRight = document.getElementById('pageRight');
const flipper = document.getElementById('flipper');
const flipFront = document.getElementById('flipFront');
const flipBack = document.getElementById('flipBack');
const chapterLabel = document.getElementById('chapterLabel');
const progressText = document.getElementById('progressText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let animating = false;
let editMode = false;

function layout(){
  // On desktop: spread shows [current] on left, [current+1] on right.
  // On mobile: single page = current
  if(isMobile()){
    pageLeft.style.display = 'none';
    pageRight.innerHTML = renderPageInner(current);
  } else {
    pageLeft.style.display = 'flex';
    pageLeft.innerHTML = renderPageInner(current);
    pageRight.innerHTML = renderPageInner(current+1);
  }
  applyEditableState();
  updateChrome();
}

function applyEditableState(){
  [pageLeft, pageRight].forEach(face => {
    const textEl = face.querySelector('.page-text');
    if(!textEl) return; // title/end pages have nothing to edit
    textEl.setAttribute('contenteditable', editMode ? 'true' : 'false');
    textEl.oninput = editMode ? onPageTextEdited : null;
  });
}

function pageIndexForFace(face){
  return face === pageLeft ? current : current + 1;
}

function onPageTextEdited(e){
  const textEl = e.target;
  const face = textEl.closest('.page-face');
  const pIdx = pageIndexForFace(face);
  const pg = pages[pIdx];
  if(!pg || pg.type !== 'content') return;

  // Read the paragraphs back out of the edited HTML, in order.
  const newParas = Array.from(textEl.querySelectorAll('p'))
    .map(p => p.textContent.trim())
    .filter(t => t.length > 0);

  pg.paras = newParas;
  const ch = CHAPTERS.find(c => c.title === pg.title);
  if(ch) ch.paras = newParas;

  hasUnsavedChanges = true;
  saveBtn.style.display = '';
}

function toggleEditMode(){
  editMode = !editMode;
  editBtn.classList.toggle('active', editMode);
  editBtn.textContent = editMode ? 'editing…' : 'edit';
  applyEditableState();
  if(editMode){
    const textEl = (isMobile() ? pageRight : pageRight).querySelector('.page-text[contenteditable="true"]');
    if(textEl) textEl.focus();
  }
}

function saveEdits(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(CHAPTERS.map(c => ({title:c.title, paras:c.paras}))));
    hasUnsavedChanges = false;
    saveBtn.style.display = 'none';
    showToast('Saved to this browser.');
  }catch(e){
    showToast('Could not save — storage may be full or blocked.');
  }
}

function showToast(msg){
  saveToast.textContent = msg;
  saveToast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> saveToast.classList.remove('show'), 2600);
}

function downloadEdits(){
  const payload = {
    title: 'The Thirteen Days',
    exportedAt: new Date().toISOString(),
    chapters: CHAPTERS.map(c => ({title:c.title, paras:c.paras}))
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'the-thirteen-days-edited.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  // Also export a plain, readable text version for actually reading/
  // pasting the edited manuscript back into a document elsewhere.
  const textLines = [];
  CHAPTERS.forEach(c => {
    textLines.push('## ' + c.title, '');
    c.paras.forEach(p => textLines.push(p, ''));
  });
  const blob2 = new Blob([textLines.join('\n')], {type:'text/plain'});
  const url2 = URL.createObjectURL(blob2);
  const a2 = document.createElement('a');
  a2.href = url2;
  a2.download = 'the-thirteen-days-edited.md';
  document.body.appendChild(a2);
  a2.click();
  document.body.removeChild(a2);
  URL.revokeObjectURL(url2);
}

function restoreOriginal(){
  if(!confirm('This will discard any saved edits on this device and bring back the originally published text. Continue?')) return;
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

function updateChrome(){
  const pg = pages[current] && pages[current].type === 'content' ? pages[current] : (pages[current+1]||pages[current]);
  chapterLabel.textContent = pg && pg.title ? pg.title : 'The Thirteen Days';
  // Show real physical page numbers, not spread index, so nothing looks "missing"
  const shownFrom = current + 1;
  const shownTo = isMobile() ? current + 1 : Math.min(current + 2, pages.length);
  if(shownFrom === shownTo){
    progressText.textContent = `page ${shownFrom} of ${pages.length}`;
  } else {
    progressText.textContent = `pages ${shownFrom}\u2013${shownTo} of ${pages.length}`;
  }
  prevBtn.disabled = current <= 0;
  nextBtn.disabled = (current + (isMobile()?1:2)) >= pages.length;
}

function goNext(){
  if(animating) return;
  const step = isMobile() ? 1 : 2;
  if(current + step >= pages.length) return;
  animating = true;

  const frontIdx = isMobile() ? current : current+1;
  const backIdx = isMobile() ? current+1 : current+2;
  flipFront.innerHTML = renderPageInner(frontIdx);
  flipBack.innerHTML = renderPageInner(backIdx);
  flipper.classList.remove('flip-prev-init');
  flipper.classList.add('active');
  flipper.style.zIndex = 20;
  flipper.style.transition = 'none';
  flipper.style.transform = 'rotateY(0deg)';
  // force reflow
  void flipper.offsetWidth;
  flipper.style.transition = '';
  requestAnimationFrame(()=>{
    flipper.classList.add('flip-next');
  });

  setTimeout(()=>{
    current += step;
    layout();
    flipper.classList.remove('flip-next');
    flipper.classList.remove('active');
    flipper.style.transition = 'none';
    flipper.style.transform = 'rotateY(0deg)';
    void flipper.offsetWidth;
    flipper.style.transition = '';
    animating = false;
  }, 950);
}

function goPrev(){
  if(animating) return;
  const step = isMobile() ? 1 : 2;
  if(current - step < 0) return;
  animating = true;

  const newCurrent = current - step;
  const frontIdx = isMobile() ? newCurrent : newCurrent+1;
  const backIdx = isMobile() ? newCurrent+1 : newCurrent+2;
  flipFront.innerHTML = renderPageInner(frontIdx);
  flipBack.innerHTML = renderPageInner(backIdx);

  flipper.classList.add('active');
  flipper.style.transition = 'none';
  flipper.style.transform = 'rotateY(-179.9deg)';
  void flipper.offsetWidth;
  flipper.style.transition = '';
  requestAnimationFrame(()=>{
    flipper.classList.remove('flip-next');
    flipper.style.transform = 'rotateY(0deg)';
  });

  setTimeout(()=>{
    current = newCurrent;
    layout();
    flipper.classList.remove('active');
    animating = false;
  }, 950);
}

document.getElementById('zoneLeft').addEventListener('click', goPrev);
document.getElementById('zoneRight').addEventListener('click', goNext);
prevBtn.addEventListener('click', goPrev);
nextBtn.addEventListener('click', goNext);

document.addEventListener('keydown', (e)=>{
  if(document.getElementById('reader').classList.contains('visible')){
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  }
});

// swipe support
let touchStartX = null;
document.getElementById('bookEl').addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
}, {passive:true});
document.getElementById('bookEl').addEventListener('touchend', e=>{
  if(touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(dx < -40) goNext();
  if(dx > 40) goPrev();
  touchStartX = null;
}, {passive:true});

window.addEventListener('resize', ()=>{ layout(); });

const coverEl = document.getElementById('coverEl');
const landing = document.getElementById('landing');
const reader = document.getElementById('reader');

function openBook(){
  coverEl.classList.add('opening');
  layout();
  setTimeout(()=>{
    landing.classList.add('hidden');
    reader.classList.add('visible');
  }, 550);
}
